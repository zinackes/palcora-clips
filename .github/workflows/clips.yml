# Les extraits gardés, coupés sur les runners gratuits d'un dépôt public.
# Seulement par cron ou à la main : jamais sur une PR (dépôt public, secrets).
name: clips

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      clips:
        description: "Essai : N extraits par job puis stop (vide = tout)"
        required: false
        default: ""
      shards:
        description: "Jobs en parallèle (20 au plus sur un compte gratuit)"
        required: false
        default: "20"
      hours:
        description: "Durée maximale par job, en heures (6 h au plus)"
        required: false
        default: "5.5"

permissions:
  contents: read

# Un seul lot à la fois : deux runs ne coupent pas les mêmes VOD.
concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        env:
          SHARDS: ${{ inputs.shards || '20' }}
        run: |
          n=$(( SHARDS > 20 ? 20 : (SHARDS < 1 ? 1 : SHARDS) ))
          echo "shards=$(seq -s, 0 $((n-1)) | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"

  cut:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    # Same image as the worker (Dockerfile): Debian trixie ships ffmpeg 7.1.
    # Ubuntu 24.04's ffmpeg 6.1 reads Twitch's fMP4 HLS from the start before
    # seeking: deep windows timed out or came back empty (27/11/2026).
    container: python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    defaults:
      run:
        # The image's default shell is sh; the last step uses bash arrays.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          ffmpeg -version | head -1
      - name: dépendances
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: extraits
        env:
          MULTIPOV: ${{ secrets.MULTIPOV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          CLIPS: ${{ inputs.clips }}
          HOURS: ${{ inputs.hours || '5.5' }}
        run: |
          args=(--shard "$SHARD" --shards "$SHARDS" --hours "$HOURS")
          if [ -n "$CLIPS" ]; then args+=(--clips "$CLIPS"); fi
          .venv/bin/python run.py "${args[@]}"
