# Times one Twitch VOD window cut in the clip job's image (ffmpeg 7.1).
# No secrets: the VOD is public and nothing is written anywhere.
name: probe

on:
  workflow_dispatch:
    inputs:
      vod:
        description: "Twitch VOD id"
        required: true
        default: "2909583295"
      start:
        description: "Window start, in seconds of the VOD"
        required: true
        default: "6153"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    steps:
      - name: tools
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pip install -q yt-dlp
      - name: cut
        env:
          VOD: ${{ inputs.vod }}
          START: ${{ inputs.start }}
        run: |
          ffmpeg -version | head -1
          url=$(yt-dlp -g -f 'best[height<=1080]' "https://www.twitch.tv/videos/$VOD")
          start=$(date +%s)
          timeout -k 5 300 ffmpeg -nostdin -y -loglevel warning -protocol_whitelist https,tls,tcp,crypto \
            -ss "$START" -i "$url" -ss 10 -t 30 -vf 'scale=-2:min(ih\,1080),fps=30' \
            -c:v libx264 -preset faster -crf 23 -c:a aac out.mp4 2>&1 | tail -5 || true
          echo "seconds: $(( $(date +%s) - start ))"
          ffprobe -v error -show_entries stream=codec_type,height:format=duration -of compact out.mp4 || true
